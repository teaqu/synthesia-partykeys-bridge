[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partykeys-bridge"
version = "0.1.2"
description = "Synthesia key lights and independent timed MIDI preview for PartyKeys 36"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["mido>=1.3.3,<2", "python-rtmidi>=1.5.8,<2"]

[project.scripts]
partykeys = "partykeys_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["partykeys_bridge*"]
