name: Executables

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            architecture: x64
            executable: partykeys.exe
          - name: macos-arm64
            runner: macos-14
            architecture: arm64
            executable: partykeys
          - name: macos-x64
            runner: macos-15-intel
            architecture: x64
            executable: partykeys
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install dependencies
        run: python -m pip install . "pyinstaller==6.22.3"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows native MIDI API helper
        if: runner.os == 'Windows'
        run: python scripts/build_windows_helper.py
      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name partykeys --hidden-import mido.backends.rtmidi
          --collect-all rtmidi packaging/entry.py
      - name: Test executable without MIDI hardware
        run: python scripts/smoke_executable.py dist/${{ matrix.executable }}
      - name: Test automatic macOS MIDI destination
        if: runner.os == 'macOS'
        run: python tests/mac_virtual_input_smoke.py dist/${{ matrix.executable }}
      - name: Package executable and instructions
        run: python scripts/package_executable.py ${{ matrix.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: partykeys-${{ matrix.name }}
          path: |
            dist/partykeys-${{ matrix.name }}.zip
            dist/partykeys-${{ matrix.name }}.sha256
          if-no-files-found: error
