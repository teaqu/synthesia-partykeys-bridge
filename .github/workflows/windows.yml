name: Windows executable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install . "pyinstaller==6.22.3"
      - name: Run tests on Windows
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name partykeys --hidden-import mido.backends.rtmidi
          --collect-all rtmidi packaging/windows_entry.py
      - name: Test executable without MIDI hardware
        run: python scripts/smoke_executable.py dist/partykeys.exe
      - name: Package executable and instructions
        shell: pwsh
        run: |
          $bundle = 'dist/partykeys-windows-x64'
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item dist/partykeys.exe $bundle
          Copy-Item README.md $bundle
          Copy-Item 'packaging/Start Synthesia bridge.cmd' $bundle
          Copy-Item examples "$bundle/examples" -Recurse
          python scripts/bundle_notices.py $bundle
          if ($LASTEXITCODE -ne 0) { throw 'Dependency notice collection failed' }
          Compress-Archive -Path "$bundle/*" -DestinationPath dist/partykeys-windows-x64.zip
          $hash = (Get-FileHash dist/partykeys-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  partykeys-windows-x64.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: partykeys-windows-x64
          path: |
            dist/partykeys-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
